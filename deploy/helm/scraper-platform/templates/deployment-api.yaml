apiVersion: apps/v1
kind: Deployment
metadata:
  name: scraper-api
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.replicas.api }}
  selector:
    matchLabels:
      app: scraper-api
  template:
    metadata:
      labels:
        app: scraper-api
    spec:
      containers:
        - name: scraper-api
          image: {{ .Values.images.api }}
          ports:
            - containerPort: 8080
          env:
            - name: POSTGRES_URL
              value: jdbc:postgresql://{{ .Values.postgres.host }}:5432/{{ .Values.postgres.database }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: scraper-secrets
                  key: postgres-password
            - name: KAFKA_BOOTSTRAP
              value: {{ .Values.kafka.bootstrap | quote }}
            - name: REDIS_HOST
              value: {{ .Values.redis.host | quote }}
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: scraper-secrets
                  key: api-key
